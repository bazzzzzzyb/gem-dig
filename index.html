<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gem Dig">
<meta name="theme-color" content="#1a0f2e">
<title>Maple's Gem Dig</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="art/icon.png">
<link rel="icon" href="art/icon.png">
<style>
:root{
  --gold:#ffd34d; --pink:#ff7ad1; --ink:#1a0f2e; --panel:rgba(22,10,44,.78);
  --font:"Avenir Next","Avenir","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#140a26;color:#fff;font-family:var(--font);overscroll-behavior:none;touch-action:none}
body{background:#140a26 url(art/bg.png) center/cover no-repeat;image-rendering:pixelated}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(20,8,40,.25),rgba(12,4,26,.75));pointer-events:none}
button{font-family:var(--font);cursor:pointer;border:0;color:#fff}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px)}
.screen.on{display:flex}

/* ---------- map ---------- */
#map{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.title{margin:10px 0 0;text-align:center;font-weight:900;font-size:42px;line-height:.95;letter-spacing:.5px;
  background:linear-gradient(180deg,#fff6c2,#ffd34d 45%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #5a1d6e) drop-shadow(0 6px 12px rgba(0,0,0,.5))}
.title small{display:block;font-size:20px;letter-spacing:4px;background:none;color:#ffd7f3;-webkit-text-fill-color:#ffd7f3}
#map-maple{width:128px;height:128px;image-rendering:pixelated;margin:-4px 0 -10px}
.statrow{display:flex;gap:10px;align-items:center;margin:4px 0 10px}
.pill{background:var(--panel);border:2px solid rgba(255,255,255,.15);border-radius:999px;padding:6px 14px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px}
.pill img{width:22px;height:22px;image-rendering:pixelated}
#chest-btn{background:linear-gradient(180deg,#ffcf4d,#ff8a1f);color:#3a1600;box-shadow:0 4px 0 #9a4300;animation:wiggle 1.2s infinite}
#chest-btn[hidden]{display:none}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-6deg)}20%{transform:rotate(6deg)}30%{transform:rotate(0)}}
#levels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%;max-width:420px;padding-bottom:14px}
.lv{aspect-ratio:1;border-radius:18px;font-weight:900;font-size:22px;position:relative;
  background:linear-gradient(180deg,#a45cff,#6a2bd1);box-shadow:0 5px 0 #3b1380,inset 0 2px 0 rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center}
.lv.done{background:linear-gradient(180deg,#ff8ad8,#d43fa0);box-shadow:0 5px 0 #7a1a5c,inset 0 2px 0 rgba(255,255,255,.35)}
.lv.cur{background:linear-gradient(180deg,#ffe066,#ffaa22);color:#4a2300;box-shadow:0 5px 0 #a35a00,0 0 18px rgba(255,210,80,.8);animation:pulse 1.4s infinite}
.lv.lock{background:rgba(255,255,255,.08);box-shadow:none;color:rgba(255,255,255,.3)}
.lv .stars{font-size:11px;letter-spacing:-1px;position:absolute;bottom:4px;color:#ffe14d;text-shadow:0 1px 0 #000}
.lv .stars .off{color:rgba(0,0,0,.35);text-shadow:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.maprow{display:flex;gap:10px;margin-bottom:8px}
.small-btn{background:var(--panel);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:9px 14px;font-weight:800;font-size:15px}

/* ---------- game ---------- */
#game{justify-content:flex-start;gap:8px}
#top{width:100%;max-width:520px;display:flex;align-items:stretch;gap:8px}
.box{background:var(--panel);border:2px solid rgba(255,255,255,.14);border-radius:16px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#back{width:44px;font-size:26px;font-weight:900;border-radius:14px;background:var(--panel);border:2px solid rgba(255,255,255,.14)}
#movesbox{width:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0}
#moves{font-size:34px;font-weight:900;line-height:1;color:var(--gold);text-shadow:0 2px 0 #7a3b00}
#moves.low{color:#ff5a6e;animation:pulse .6s infinite}
.lbl{font-size:11px;font-weight:800;letter-spacing:1.5px;opacity:.75;text-transform:uppercase}
#scorebox{flex:1;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;gap:4px}
#scorerow{display:flex;justify-content:space-between;align-items:baseline}
#lvlname{font-weight:800;font-size:14px;opacity:.85}
#score{font-weight:900;font-size:22px}
#bar{position:relative;height:12px;border-radius:99px;background:rgba(0,0,0,.45);overflow:visible}
#fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ff7ad1,#ffd34d);transition:width .35s}
.bstar{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:18px;color:rgba(0,0,0,.5);text-shadow:0 0 2px rgba(255,255,255,.4);transition:.3s}
.bstar.on{color:#ffe14d;text-shadow:0 0 8px #ffb300,0 1px 0 #7a3b00;transform:translate(-50%,-50%) scale(1.2)}
#goals{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:520px}
.goal{display:flex;align-items:center;gap:4px;padding:4px 10px 4px 6px;font-weight:900;font-size:18px;border-radius:14px}
.goal img{width:30px;height:30px;image-rendering:pixelated}
.goal.done{background:rgba(40,160,90,.55)}
.goal.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.18)}}
#boardwrap{position:relative;margin:auto 0;border-radius:18px;padding:6px;background:rgba(10,4,24,.6);border:2px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 30px rgba(140,80,255,.15)}
#board{display:block;touch-action:none;image-rendering:pixelated}
#bottom{width:100%;max-width:520px;display:flex;align-items:flex-end;justify-content:space-between;}
#boosters{display:flex;gap:8px}
.boost{width:62px;height:62px;border-radius:18px;font-size:28px;position:relative;
  background:linear-gradient(180deg,#5f3bd6,#3a1f99);box-shadow:0 5px 0 #1f0d5c,inset 0 2px 0 rgba(255,255,255,.3)}
.boost .n{position:absolute;right:-5px;top:-5px;min-width:22px;height:22px;border-radius:11px;background:#ff3d7a;font-size:13px;font-weight:900;line-height:22px;padding:0 5px;box-shadow:0 2px 0 #7a0030}
.boost.on{background:linear-gradient(180deg,#ffe066,#ffaa22);box-shadow:0 5px 0 #a35a00,0 0 18px #ffd34d}
.boost:disabled{opacity:.4}
#game-maple{width:120px;height:120px;margin:-14px -6px -10px 0;image-rendering:pixelated}
#tip{position:absolute;left:0;right:0;bottom:-30px;text-align:center;font-weight:800;color:#ffe14d;font-size:14px;text-shadow:0 1px 2px #000;pointer-events:none}

/* ---------- banners & modals ---------- */
#banner{position:fixed;left:0;right:0;top:42%;text-align:center;pointer-events:none;z-index:20}
#banner span{display:inline-block;font-weight:900;font-size:46px;color:#fff;
  -webkit-text-stroke:2px #5a1d6e;text-shadow:0 4px 0 #5a1d6e,0 0 24px rgba(255,120,220,.9);animation:pop 1.1s forwards}
#banner span.big{font-size:58px;background:linear-gradient(180deg,#fff,#ffe14d 50%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 4px 0 #5a1d6e) drop-shadow(0 0 16px rgba(255,180,60,.8));text-shadow:none}
@keyframes pop{0%{transform:scale(.2) rotate(-8deg);opacity:0}18%{transform:scale(1.15) rotate(2deg);opacity:1}30%{transform:scale(1) rotate(0)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1) translateY(-30px)}}
#modal{position:fixed;inset:0;background:rgba(8,2,20,.7);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
#modal.on{display:flex}
#card{width:100%;max-width:360px;border-radius:26px;padding:22px 20px 20px;text-align:center;
  background:linear-gradient(180deg,#3d1f7a,#22104a);border:3px solid rgba(255,255,255,.2);box-shadow:0 20px 50px rgba(0,0,0,.6);animation:cardin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes cardin{from{transform:scale(.6);opacity:0}}
#card h2{margin:0 0 6px;font-size:30px;font-weight:900;color:var(--gold);text-shadow:0 3px 0 #6a2a00}
#card p{margin:6px 0;font-size:16px;line-height:1.35;opacity:.92}
#card .big-stars{font-size:52px;letter-spacing:4px;margin:4px 0}
#card .big-stars span{display:inline-block;color:rgba(0,0,0,.4);transition:.3s}
#card .big-stars span.on{color:#ffe14d;text-shadow:0 0 16px #ffb300,0 3px 0 #8a4a00;animation:starpop .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}}
#card .goals-list{display:flex;gap:10px;justify-content:center;margin:12px 0;flex-wrap:wrap}
#card .btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.btn{padding:14px;border-radius:18px;font-size:20px;font-weight:900;background:linear-gradient(180deg,#5ee87a,#21b04a);box-shadow:0 5px 0 #0e6a28,inset 0 2px 0 rgba(255,255,255,.35);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.alt{background:linear-gradient(180deg,#8a6bd8,#5a3fb0);box-shadow:0 5px 0 #2d1a6e,inset 0 2px 0 rgba(255,255,255,.3);font-size:17px}
.btn:active,.boost:active,.lv:active{transform:translateY(3px)}
.howto{text-align:left;font-size:15px}
.howto div{display:flex;align-items:center;gap:10px;margin:8px 0}
.howto .ic{width:40px;height:40px;flex:none;border-radius:10px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:22px}
.howto img{width:34px;height:34px;image-rendering:pixelated}
/* ---------- stage 2: Vegas ---------- */
body.vegas{background-image:url(art/vegas/bg.png)}
body.vegas::before{background:radial-gradient(ellipse at 50% 45%,rgba(20,6,40,.45),rgba(10,2,24,.82))}
body.vegas .title{background:linear-gradient(180deg,#fff,#ff9ad8 40%,#ff3d9a);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 3px 0 #5a0f4a) drop-shadow(0 0 14px rgba(255,80,180,.7))}
body.vegas .title small{-webkit-text-fill-color:#ffe9a8;color:#ffe9a8;letter-spacing:2px;font-size:17px}
body.vegas #boardwrap{border-color:#ffd34d;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 22px rgba(255,90,190,.55),inset 0 0 30px rgba(255,180,60,.12)}
body.vegas .lv{background:linear-gradient(180deg,#ff5fb8,#b01f86);box-shadow:0 5px 0 #5c0f47,inset 0 2px 0 rgba(255,255,255,.35)}
body.vegas .lv.done{background:linear-gradient(180deg,#3fd0c0,#178a8a);box-shadow:0 5px 0 #0b4a4f,inset 0 2px 0 rgba(255,255,255,.35)}
body.vegas .lv.cur{background:linear-gradient(180deg,#ffe066,#ffaa22);color:#4a2300;box-shadow:0 5px 0 #a35a00,0 0 18px rgba(255,210,80,.8)}
body.vegas .lv.lock{background:rgba(255,255,255,.08);box-shadow:none}
#stages{display:flex;gap:8px;margin:10px 0 2px;width:100%;max-width:420px}
#stages button{flex:1;position:relative;padding:10px 6px;border-radius:14px;font-weight:900;font-size:15px;background:var(--panel);border:2px solid rgba(255,255,255,.18);opacity:.75}
#stages button.on{opacity:1;border-color:var(--gold);box-shadow:0 0 14px rgba(255,210,80,.55)}
#stage-new{position:absolute;top:-9px;right:-4px;background:#ff3d7a;border-radius:9px;font-size:11px;padding:2px 7px;box-shadow:0 2px 0 #7a0030;animation:pulse 1s infinite}
#stage-new[hidden]{display:none}
#mascots{display:flex;align-items:flex-end;justify-content:center}
#map-buddy{width:96px;height:96px;image-rendering:pixelated;margin:0 0 -4px -14px}
#map-buddy[hidden],#game-buddy[hidden],#jack[hidden]{display:none}
#pets{display:flex;align-items:flex-end}
#game-buddy{width:84px;height:84px;image-rendering:pixelated;margin:0 -26px -6px 0}
body.vegas #game-maple{width:104px;height:104px;margin:-8px -6px -6px 0}
#jack{width:100%;max-width:520px;display:flex;align-items:center;gap:8px;padding:0 4px}
#jack img{width:26px;height:26px;image-rendering:pixelated;flex:none}
#jack .lbl{flex:none;color:#ffe9a8;opacity:1}
#jackbar{flex:1;height:12px;border-radius:99px;background:rgba(0,0,0,.55);border:2px solid rgba(255,211,77,.55);overflow:hidden}
#jackfill{height:100%;width:0;background:linear-gradient(90deg,#ff3d9a,#ffd34d);transition:width .35s}
#jack.hot #jackbar{box-shadow:0 0 12px #ffd34d;animation:pulse .5s infinite}
#slot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:28;background:rgba(8,2,20,.6);padding:20px}
#slot.on{display:flex}
#slot .machine{width:100%;max-width:330px;border-radius:26px;padding:14px 16px 16px;text-align:center;
  background:linear-gradient(180deg,#d4145a,#7a0b3a);border:4px solid #ffd34d;box-shadow:0 0 0 4px #7a4a00,0 20px 50px rgba(0,0,0,.6),0 0 40px rgba(255,80,180,.6);animation:cardin .3s cubic-bezier(.2,1.6,.4,1)}
#slot .marq{font-weight:900;font-size:20px;letter-spacing:3px;color:#ffe14d;text-shadow:0 2px 0 #6a2a00,0 0 12px #ffb300;margin-bottom:10px;animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.6}}
#slot .reels{display:flex;gap:8px;justify-content:center;background:#2a0518;border-radius:16px;padding:8px;border:3px solid #ffd34d}
#slot .reel{width:76px;height:76px;overflow:hidden;border-radius:10px;background:linear-gradient(180deg,#d8d0c0,#fffdf5 30%,#fffdf5 70%,#d8d0c0)}
#slot .it{height:76px;display:flex;align-items:center;justify-content:center}
#slot .strip img{display:block;width:64px;height:64px;image-rendering:pixelated}
#slot .res{min-height:58px;margin-top:10px;display:flex;flex-direction:column;justify-content:center}
#slot .res b{font-size:26px;font-weight:900;color:#fff;text-shadow:0 3px 0 #5a0f2a}
#slot .res span{font-size:15px;font-weight:800;color:#ffe9a8}
#slot.win .reels{box-shadow:0 0 24px #ffd34d;animation:pulse .4s 3}
#slot.big .res b{font-size:34px;color:#ffe14d;text-shadow:0 3px 0 #6a2a00,0 0 18px #ffb300}
.flyer{position:fixed;z-index:25;pointer-events:none;image-rendering:pixelated;filter:drop-shadow(0 0 8px #ffd34d)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;z-index:50;background:#140a26}
</style>
</head>
<body>
<div id="loading">Digging up gems…</div>

<div id="map" class="screen">
  <h1 class="title">Maple's<br>Gem Dig<small>✦ no ads · no paywalls ✦</small></h1>
  <div id="mascots"><canvas id="map-maple" width="64" height="64"></canvas><canvas id="map-buddy" width="64" height="64" hidden></canvas></div>
  <div id="stages">
    <button data-s="0">💎 Crystal Cave</button>
    <button data-s="1">🎰 Vegas Nights<span id="stage-new">NEW</span></button>
  </div>
  <div class="statrow">
    <div class="pill">⭐ <span id="total-stars">0</span></div>
    <div class="pill" id="boost-pill">🔨 <span id="bp-h">0</span> 🔀 <span id="bp-s">0</span> 💥 <span id="bp-p">0</span></div>
  </div>
  <div class="statrow"><button class="pill" id="chest-btn" hidden>🎁 Open treasure!</button><div class="pill" id="chest-prog"></div></div>
  <div id="levels"></div>
  <div class="maprow">
    <button class="small-btn" id="howto-btn">How to play</button>
    <button class="small-btn" id="sound-btn">🔊 Sound</button>
  </div>
</div>

<div id="game" class="screen">
  <div id="top">
    <button id="back">‹</button>
    <div id="movesbox" class="box"><div id="moves">20</div><div class="lbl" id="moveslbl">moves</div></div>
    <div id="scorebox" class="box">
      <div id="scorerow"><span id="lvlname">Level 1</span><span id="score">0</span></div>
      <div id="bar"><div id="fill"></div><span class="bstar" id="bs1" style="left:33%">★</span><span class="bstar" id="bs2">★</span><span class="bstar" id="bs3" style="left:97%">★</span></div>
    </div>
  </div>
  <div id="goals"></div>
  <div id="jack" hidden><img src="art/vegas/seven.png" alt=""><span class="lbl">Jackpot</span><div id="jackbar"><div id="jackfill"></div></div></div>
  <div id="boardwrap"><canvas id="board"></canvas><div id="tip"></div></div>
  <div id="bottom">
    <div id="boosters">
      <button class="boost" id="b-hammer">🔨<span class="n">0</span></button>
      <button class="boost" id="b-shuffle">🔀<span class="n">0</span></button>
      <button class="boost" id="b-paw">💥<span class="n">0</span></button>
    </div>
    <div id="pets"><canvas id="game-buddy" width="64" height="64" hidden></canvas><canvas id="game-maple" width="64" height="64"></canvas></div>
  </div>
</div>

<div id="slot"><div class="machine">
  <div class="marq">★ LUCKY SPIN ★</div>
  <div class="reels"><div class="reel"><div class="strip"></div></div><div class="reel"><div class="strip"></div></div><div class="reel"><div class="strip"></div></div></div>
  <div class="res">&nbsp;</div>
</div></div>

<div id="banner"></div>
<div id="modal"><div id="card"></div></div>

<script src="game.js"></script>
</body>
</html>
